<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 1 · 杂志封面 Editorial</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#141210;--paper:#f4f1ea;--accent:#c1440e;--dim:#8a8072}
  body{background:var(--paper);color:var(--ink);
    font-family:"Songti SC","Noto Serif SC",serif;min-height:100vh;padding:48px 5vw}
  .masthead{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:3px solid var(--ink);padding-bottom:14px}
  .issue{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
  .vol{font-size:11px;letter-spacing:.2em;color:var(--dim)}
  .name{font-size:clamp(64px,12vw,150px);font-weight:900;line-height:.92;
    letter-spacing:-.02em;margin:34px 0 0;word-break:break-word}
  .name em{font-style:normal;color:var(--accent)}
  .tagline{display:flex;gap:26px;margin-top:20px;align-items:center;flex-wrap:wrap}
  .tagline .rule{flex:1;height:1px;background:var(--ink);opacity:.3;min-width:40px}
  .bio{font-size:17px;line-height:1.8;max-width:46ch;color:#3a352c}
  .pill{font-size:12px;border:1px solid var(--ink);padding:5px 14px;border-radius:999px;white-space:nowrap}
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:0;margin-top:48px;border-top:3px solid var(--ink)}
  .cell{padding:34px 30px;border-right:1px solid rgba(20,18,16,.18)}
  .cell:last-child{border-right:0}
  .cell+.cell{border-top:0}
  .cell h3{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .quote{font-size:30px;line-height:1.5;font-weight:600}
  .quote .no{font-size:60px;color:var(--accent);display:block;line-height:1}
  .link{display:flex;justify-content:space-between;align-items:center;padding:14px 0;
    border-bottom:1px solid rgba(20,18,16,.14);font-size:16px}
  .link:hover{color:var(--accent)}
  .link .arrow{color:var(--accent)}
  .avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;
    border:4px solid var(--ink);display:block;margin:0 auto}
  .mood{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{font-size:13px;border:1px solid var(--ink);padding:5px 12px;border-radius:3px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.cell{border-right:0;border-bottom:1px solid rgba(20,18,16,.18)}}
</style>
</head>
<body>
  <div class="masthead">
    <span class="issue">Personal Card · Vol.01</span>
    <span class="vol">NO.001 — 2026</span>
  </div>
  <h1 class="name">Dou<em>lor</em></h1>
  <div class="tagline">
    <span class="pill">☕ 正在完善 Doulor Cloud</span>
    <span class="rule"></span>
    <span class="bio">一个有点内向的人</span>
  </div>
  <div class="grid">
    <div class="cell">
      <h3>名言 / Quote</h3>
      <div class="quote"><span class="no">01</span>旧人不知我近况，新人不知我过往</div>
    </div>
    <div class="cell" style="text-align:center">
      <img class="avatar" src="https://api.dicebear.com/9.x/adventurer/svg?seed=Doulor" alt="avatar">
      <div class="mood" style="justify-content:center">
        <span class="chip">#肝帝</span><span class="chip">#建站</span><span class="chip">#极简</span>
      </div>
    </div>
  </div>
  <div class="cell" style="border-right:0;border-top:1px solid rgba(20,18,16,.18)">
    <h3>联系 / Contact</h3>
    <a class="link" href="#"><span>GitHub — Doulor</span><span class="arrow">↗</span></a>
    <a class="link" href="#"><span>QQ — 2737855297</span><span class="arrow">↗</span></a>
    <a class="link" href="#"><span>微信 — AIDoulor</span><span class="arrow">↗</span></a>
  </div>
</body>
</html>
