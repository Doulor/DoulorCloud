name = "doulor-mail-api"
main = "src/index.ts"
compatibility_date = "2026-09-21"

# 不在配置文件里声明 [[routes]]。
#
# 原因（重要）：wrangler deploy 会用配置文件里的 routes **覆盖**该 Worker 在
# Cloudflare 上的全部路由触发器——即「配置里没列出的 Route 会被删掉」。
# 本项目有「用户动态绑定自定义域名」的能力（名片 / 网盘直链，见
# custom-domain.ts 的 attachCustomDomain，通过 API 增删 Route），这些动态
# Route 不可能写死在配置里，于是每次 deploy 都会把它们清空，表现为绑定的
# 自定义域名访问报 522/523（DNS 橙云正常但无 Route 匹配）。
#
# 官方文档明确：配置文件**不声明** routes 时，deploy 不会触碰 dashboard/API
# 已建的路由。故这里不声明，全部 Route 由 CF dashboard + 运行时 API 维护。
# 另加 workers_dev = false，不暴露 *.workers.dev 预览域名。
#
# 当前线上应存在的固定 Route（如被误删需手动在 dashboard 重建，均指向 doulor-mail-api）：
#   doulor.cn/api/*          cloud.doulor.cn/api/*
#   doulor.cn/dl/*           cloud.doulor.cn/dl/*
#   doulor.cn/profile/*      cloud.doulor.cn/profile/*
#   doulor.cn/p/*            cloud.doulor.cn/p/*
# 动态 Route（由 attachCustomDomain / detachCustomDomain 维护）：
#   <用户绑定的子域名>/*  如 xxx.doulor.cn/*、abc.doulor.cn/*
workers_dev = false

# 显式声明账户，避免多账户下 wrangler 交互式选择失败
account_id = "83fdea7d910cbc683e6d53fa6baf45ab"

# D1
[[d1_databases]]
binding = "DB"
database_name = "doulor-mail"
database_id = "9ae6127c-75f7-4688-bbe3-31ed856859c5"


# 出站邮件：Cloudflare Email Service 的 send_email 绑定。
#
# 注意语法是 `[[send_email]]`（数组表）—— 早期这里误写成 `[email]`，
# wrangler 只当作未知字段忽略，绑定从未生效过。
#
# 限制（官方文档 2026-09 实测）：
#   - 发送域名必须在面板 Compute > Email Service > Email Sending 里 Onboard；
#     **在完成 onboard 之前，只能发往账户内“已验证的 destination address”**。
#     因此「验证真实邮箱」「找回账号」「发公告」都依赖它。
#   - 发件地址必须属于已 onboard 的域名。
#
# 安全：不设 allowed_destination_addresses —— 那会把绑定限制成只能发给
# doulor.cn（即只能发给自己），正好与需求相反。改为用 allowed_sender_addresses
# 限定发件人，收件人交由运行时校验（见 mailer.ts）。
#
# ⚠️ 2026-09-23：发件白名单**保持原样**（no-reply@ / support@）。
#
#   背景：原先为了让「网页端以用户自己的邮箱回信」可行，曾把本键删掉。
#   但站长确认**不做 Email Sending 域名 Onboard（需付费）**，而在 Onboard 之前
#   Cloudflare 只允许发往账户内「已验证的 destination address」，回信本来就发不到
#   任意外部地址 —— 那删除本键就**只有放宽风险、没有实际收益**，故恢复原状。
#
#   等哪天做了 Onboard，再删掉本键（或确认 CF 是否支持 `*@doulor.cn` 通配），
#   用户才能以自己的地址回信。运行时仍会校验发件人（见 mailer.ts 的 sendReply）。
#
# ⚠️ 2026-09-28 修正：`allowed_sender_addresses` 原先写在 `[[d1_databases]]` 段里
#   （TOML 中键属于**上一个**表头），被 wrangler 判为未知字段并忽略 ⇒ 白名单
#   实际从未生效（每次 deploy 都警告，日志一直显示 `env.EMAIL (unrestricted)`）。
#   现已挪进它该在的 `[[send_email]]` 段内。
#
#   影响评估：CF 通道的发件人恒为 `no-reply@doulor.cn`（mailer.ts 的 MAIL_FROM），
#   在白名单内 ⇒ 不影响发信。唯一用「用户自己地址」发件的是网页端回信（sendReply），
#   而它要求发往**外部**地址（本站域名被 REPLY_LOOP 拦掉），在 CF Onboard 之前本就发不出去
#   ⇒ 对用户零行为变化，只是把白名单真正落到位。
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [
  "no-reply@doulor.cn",
  "support@doulor.cn",
]

[triggers]
# 定时运维（worker/src/maintenance.ts）：
#   每小时 :17 清理过期分享箱（D1 + R2 对象）、过期会话、过期限流窗口，
#   并做网盘记账自检与大表行数预警；“深度模式”（额外清理 90 天前审计日志）
#   在 UTC 03:xx 那一次自动触发。
# 选 :17 而不是 :00 是为了避开整点的全局调度高峰。
#
# 第二个 cron 专管「到点发布」（定时公告 / 定时活动上线）：
#   每分钟跑一次，无任务时只有两条 SELECT，开销可忽略 —— 换来分钟级的发布精度。
#   ⚠️ 它只跑 worker/src/scheduled-publish.ts，**不**跑完整运维（否则成本 ×60）。
#   index.ts 的 scheduled 靠 controller.cron 区分这两条，两边必须保持一致。
crons = ["17 * * * *", "* * * * *"]

[vars]
ROOT_DOMAIN = "doulor.cn"
ZONE_ID = "141ef5bed7dae38f4ffa094809bf0998"
ACCOUNT_ID = "83fdea7d910cbc683e6d53fa6baf45ab"