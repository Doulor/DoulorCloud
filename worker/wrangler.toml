name = "doulor-mail-api"
main = "src/index.ts"
compatibility_date = "2026-09-21"

# D1
[[d1_databases]]
binding = "DB"
database_name = "doulor-mail"
database_id = "9ae6127c-75f7-4688-bbe3-31ed856859c5"

# 路由：裸域与应用域的 /api/* 都指向本 Worker
[[routes]]
pattern = "doulor.cn/api/*"
zone_name = "doulor.cn"

[[routes]]
pattern = "mail.doulor.cn/api/*"
zone_name = "doulor.cn"

# R2 直链：/dl/<用户名>/<文件名> 需要由本 Worker 反代
# （mail.doulor.cn 其余路径仍由静态站点 Worker 处理，更精确的路由优先）
[[routes]]
pattern = "mail.doulor.cn/dl/*"
zone_name = "doulor.cn"

[[routes]]
pattern = "doulor.cn/dl/*"
zone_name = "doulor.cn"

# 出站邮件：Cloudflare Email Service 的 send_email 绑定。
#
# 注意语法是 `[[send_email]]`（数组表）—— 早期这里误写成 `[email]`，
# wrangler 只当作未知字段忽略，绑定从未生效过。
#
# 限制（官方文档 2026-09 实测）：
#   - 发送域名必须在面板 Compute > Email Service > Email Sending 里 Onboard；
#     **在完成 onboard 之前，只能发往账户内“已验证的 destination address”**。
#     因此「验证真实邮箱」「找回账号」「发公告」都依赖它。
#   - 发件地址必须属于已 onboard 的域名。
#
# 安全：不设 allowed_destination_addresses —— 那会把绑定限制成只能发给
# doulor.cn（即只能发给自己），正好与需求相反。改为用 allowed_sender_addresses
# 限定发件人，收件人交由运行时校验（见 mailer.ts）。
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [
  "no-reply@doulor.cn",
  "support@doulor.cn",
]

[vars]
ROOT_DOMAIN = "doulor.cn"
ZONE_ID = "141ef5bed7dae38f4ffa094809bf0998"
ACCOUNT_ID = "83fdea7d910cbc683e6d53fa6baf45ab"