<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doulor Cloud — 一站式云端平台，域名与服务开箱即用。" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Doulor Cloud</title>

    <!--
      尽早确定主题，必须在首帧之前执行。
      原先是靠 React 的 useEffect 给 <html> 打 dark 类，那要等 1.6 MB 的 JS 下载执行完 ——
      深色模式的用户会先看到一帧白底（开屏动画恰好在这段时间里，所以特别明显）。
      规则与 hooks/use-theme.ts 保持一致：存过的优先，否则跟随系统。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("doulor-theme")
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var dark = saved === "dark" || ((!saved || saved === "system") && prefersDark)
          document.documentElement.classList.toggle("dark", dark)
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错；拿不到就按浅色走，不阻塞渲染 */
        }
      })()
    </script>

    <!-- Open Graph：分享到 QQ / 微信 / Telegram 等时渲染的链接卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doulor Cloud" />
    <meta property="og:title" content="Doulor Cloud — 一站式云端平台" />
    <meta property="og:description" content="域名、邮箱、网盘、AI 等，一个账号开箱即用。" />
    <meta property="og:image" content="https://cloud.doulor.cn/favicon.png?v=2" />
    <meta property="og:url" content="https://cloud.doulor.cn" />
    <!-- Twitter/X 卡片兼容（也回退用 og 标签） -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Doulor Cloud — 一站式云端平台" />
    <meta name="twitter:description" content="域名、邮箱、网盘、AI 等，一个账号开箱即用。" />
    <meta name="twitter:image" content="https://cloud.doulor.cn/favicon.png?v=2" />

    <!--
      开屏动画的样式。刻意内联在这里、而不是放进 src/index.css：
      这段 HTML 在 <body> 里，浏览器一解析到就渲染，不必等 JS 下载执行
      （线上 vendor 包有 1.6 MB，等 React 挂载要一两秒 —— 那时页面都出来了，再盖一层就没意义了）。
      只在整页加载 / 刷新时出现一次：SPA 路由切换不会重新加载本文件，所以不需要任何额外判断。
      云用的是站上同一个图标（lucide Cloud），放大到 160px、不带外框。
    -->
    <style>
      /* ── 开屏（2026-10-17 重做） ────────────────────────────────────────────
         · 云的描边：**曲线、总时长、缓动与原来完全一致**
           （720ms + cubic-bezier(0.3, 0.4, 0.6, 0.8)），只是改由内联脚本驱动，
           好在「画到 87%」时停下来等应用就绪。
         · 收尾：0.45s 放大淡出 + 背景晚 70ms 淡出 + 630ms 后摘除 —— 也与原来一致，
           只是触发时机从「固定 0.87s」改成「就绪信号」。
         ⚠️ 这份样式必须自带全部规则（不依赖 src/index.css）：它要在 CSS 文件下载完
            之前就把开屏画对，否则深色模式下会「白底一闪」。
      ──────────────────────────────────────────────────────────────────── */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 刻意用写死的颜色、不用 var(--background)：变量定义在按需加载的样式表里。
         深浅两套值通过 html.dark 切换；数值与 src/index.css 的
         --background / --foreground 一致（浅色 oklch(1 0 0) / oklch(0.145 0 0)，深色反之）。 */
      .splash-bg {
        position: absolute;
        inset: 0;
        background: #ffffff;
      }
      html.dark .splash-bg {
        background: #0a0a0a;
      }
      .splash-wrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .splash-cloud {
        color: #0a0a0a;
      }
      html.dark .splash-cloud {
        color: #fafafa;
      }
      .splash-cloud svg {
        width: 160px;
        height: 160px;
        overflow: visible;
      }
      /* 55.39 是这条 path 的实测长度（getTotalLength）。写大了会「画完了还在空走」，写小了会画不满。
         进度由内联脚本写 style.strokeDashoffset 驱动（参数与旧 CSS animation 相同）。 */
      .splash-cloud path {
        stroke-dasharray: 55.39;
        stroke-dashoffset: 55.39;
      }
      /* 站名：淡入仍是原来的 0.15s ease（旧 keyframes 里 0% -> 11%，总时长 1.36s）。
         区别只是它现在会一直留到收尾，而不是 1.36s 自己淡掉。 */
      .splash-name {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #0a0a0a;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      html.dark .splash-name {
        color: #fafafa;
      }
      .splash.is-named .splash-name {
        opacity: 1;
      }
      /* 收尾动画：与原来那套 keyframes 完全一致，只是触发时机改由就绪信号决定 */
      @keyframes boot-splash-out {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(1.5);
        }
      }
      @keyframes boot-splash-bg-out {
        to {
          opacity: 0;
        }
      }
      .splash.is-out .splash-cloud {
        animation: boot-splash-out 0.45s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      .splash.is-out .splash-name {
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      /* 背景比云朵晚 70ms 淡出（原来是 0.94s vs 0.87s，差 70ms） */
      .splash.is-out .splash-bg {
        animation: boot-splash-bg-out 0.3s ease 0.07s both;
      }
      @media (max-width: 480px) {
        .splash-cloud svg {
          width: 112px;
          height: 112px;
        }
        .splash-name {
          font-size: 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- 开屏动画本体：不经过 React，页面一解析就显示 -->
    <div class="splash" id="boot-splash" aria-hidden="true">
      <div class="splash-bg"></div>
      <div class="splash-wrap">
        <div class="splash-cloud">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
          </svg>
        </div>
        <div class="splash-name">Doulor Cloud</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA：等页面加载完再注册 Service Worker，不抢首屏时间。
      // 注册失败（旧浏览器/隐私模式）不影响站点本身。
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {})
        })
      }
    </script>
    <script>
      /**
       * 开屏动画的驱动（2026-10-17）。
       *
       * 要求（站长原话）：「云的动画除了最后会断开停止，其他的效果跟之前都一模一样」。
       * 所以这里的**动画参数一个没改**：
       *   · 总时长 720ms、缓动 cubic-bezier(0.3, 0.4, 0.6, 0.8) —— 与旧 CSS 完全相同；
       *   · 收尾 0.45s 放大淡出、背景晚 70ms 淡出、630ms 后摘除 —— 也与旧 CSS 相同。
       * 唯一的变化：**不再由固定时间触发收尾**，而是
       *   「画到 87% 停下等 → 应用就绪 → 按同一条曲线接到 100% → 收尾」。
       *
       * 关键实现：用一个「动画时钟」vclock 驱动进度（f = ease(vclock / 720)）。
       * 需要等待时**只冻结 vclock**，而不是重算一条新曲线 ——
       *   · 暂停点：就是原来那条曲线走到 87% 的那个位置，一像素不差；
       *   · 恢复后：从同一个 vclock 继续走，速度曲线与原来完全一致，不会顿；
       *   · 如果应用在画到 87% 之前就绪：根本不暂停，动画与原来完全相同。
       */
      (function () {
        var el = document.getElementById("boot-splash");
        if (!el) return;
        var path = el.querySelector(".splash-cloud path");

        var LEN = 55.39;             /* 与 CSS 的 stroke-dasharray 一致（实测 getTotalLength） */
        var FULL_MS = 720;           /* 旧 CSS：boot-splash-draw 0.72s */
        var HOLD_FRACTION = 0.87;    /* 画到 87% 停住 —— 剩下那截就是「断开」的缺口 */
        var FALLBACK_MS = 10000;     /* 信号一直不来：自己收尾 */
        var REMOVE_MS = 630;         /* 旧 CSS：0.87s 起淡出、1.5s 摘除，相差 630ms */

        /* 与旧 CSS 完全相同的缓动：cubic-bezier(0.3, 0.4, 0.6, 0.8) */
        var easeDraw = cubicBezier(0.3, 0.4, 0.6, 0.8);

        var vclock = 0;              /* 「动画时钟」：暂停时冻结，所以曲线不走样 */
        var lastReal = 0;
        var paused = false;
        var ready = false;           /* 是否已收到就绪信号（**独立于 paused**：
                                        否则信号先于 87% 到达时，循环会重新把 paused 置真，
                                        之后就再没有信号来，永远停在 87%） */
        var done = false;
        var raf = 0;

        function setOffset(v) {
          if (path) path.style.strokeDashoffset = String(v);
        }
        setOffset(LEN);

        /* 站名随后淡入（旧 CSS 是 0~150ms 淡入） */
        requestAnimationFrame(function () {
          if (!done) el.classList.add("is-named");
        });

        function endOut() {
          if (done) return;
          done = true;
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          setOffset(0);
          el.classList.add("is-out");
          setTimeout(function () {
            var node = document.getElementById("boot-splash");
            if (node) node.remove();
          }, REMOVE_MS);
        }

        function frame(now) {
          if (done) return;
          if (!lastReal) lastReal = now;   /* 首帧才设基准，避免起步瞬移 */
          var dt = now - lastReal;
          lastReal = now;

          if (!paused) {
            vclock += dt;
            if (vclock > FULL_MS) vclock = FULL_MS;
            var f = easeDraw(vclock / FULL_MS);
            if (f >= HOLD_FRACTION && !ready) {
              /* 还没就绪才停：只冻结时钟，进度与曲线都不动 */
              f = HOLD_FRACTION;
              paused = true;
            }
            setOffset(LEN * (1 - f));
            if (vclock >= FULL_MS) {
              endOut();
              return;
            }
          }
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);

        window.__bootReady = function () {
          if (done) return;
          ready = true;
          /* 还在画（没到 87%）？那就什么都不用做 —— 动画本来就会一路走到 100%，
             与原来的表现完全相同。已经到了等待点？解冻时钟，按原曲线接上。 */
          paused = false;
        };

        /* 信号迟迟不来：自己收尾，别把开屏永远留在屏幕上 */
        setTimeout(function () {
          window.__bootReady();
        }, FALLBACK_MS);
      })();

      /**
       * 三次贝塞尔求值（CSS cubic-bezier 的 x→y 版本）。
       * 用牛顿迭代反解 t，够快也够准（8 次迭代的误差远小于半个像素）。
       */
      function cubicBezier(x1, y1, x2, y2) {
        function a(p1, p2) {
          return 1 - 3 * p2 + 3 * p1;
        }
        function b(p1, p2) {
          return 3 * p2 - 6 * p1;
        }
        function c(p1) {
          return 3 * p1;
        }
        function calc(t, p1, p2) {
          return ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t;
        }
        function slope(t, p1, p2) {
          return 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1);
        }
        return function (x) {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          var t = x;
          for (var i = 0; i < 8; i++) {
            var s = slope(t, x1, x2);
            if (s === 0) break;
            t -= (calc(t, x1, x2) - x) / s;
          }
          if (t < 0) t = 0;
          if (t > 1) t = 1;
          return calc(t, y1, y2);
        };
      }
    </script>
    <script>
      /**
       * 「一行 JS 都没跑起来」时的自救。
       *
       * 场景：部署后 chunk 哈希变了，而用户浏览器里还留着**旧 HTML**（它记着旧的
       * `assets/index-<old>.js`）。那个文件服务器上已经没有了 → 404 →
       * **入口脚本本身加载失败，任何业务 JS 都不会执行**。
       * 于是 src/lib/chunk-error.ts 那套全局兜底（它自己也是 JS）根本没机会生效，
       * 页面就停在启动画面上 —— 用户看到的就是「只有背景」（2026-10-02 站长反馈）。
       *
       * 这段内联脚本在 HTML 里就地生效，不依赖任何外部资源：
       *   ① 模块脚本加载失败 → 立刻刷新一次；
       *   ② 兜底：12 秒后应用仍未挂载（root 还是空的）→ 也刷新一次。
       *
       * 防循环（2026-10-05 修「手机端隔几秒就重播开屏动画」）用**双重保险**：
       *   · 一个会话最多自动刷新 2 次；
       *   · 两次之间至少间隔 15 秒。
       * 为什么不能只靠 10 秒时间窗：弱网手机上下载 1.6 MB 主 JS 常超 10 秒，
       * 时间窗会失效；5 秒兜底在弱网下也必然误伤「只是慢、不是失败」的加载。
       * 改成「最多 2 次」后，无论多差的环境，自动刷新顶多发生 2 次就停。
       */
      (function () {
        var KEY = "boot-reload-at";
        var COUNT_KEY = "boot-reload-count";
        var MAX_RELOADS = 2;
        var MIN_INTERVAL = 15000;
        function reloadOnce() {
          try {
            var count = Number(sessionStorage.getItem(COUNT_KEY) || 0);
            if (count >= MAX_RELOADS) return; // 刷满次数，放弃，交给用户手动刷新
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < MIN_INTERVAL) return; // 刚刷过
            sessionStorage.setItem(COUNT_KEY, String(count + 1));
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {
            // 隐私模式等场景 sessionStorage 不可用：仍然刷一次
          }
          location.reload();
        }
        // ① 模块脚本 404 会以 error 事件冒泡到 window，必须用 capture 才收得到
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") reloadOnce();
          },
          true
        );
        // ② 兜底：React 没挂载成功（root 为空）也刷一次。
        //    12 秒（原 5 秒太激进）：弱网手机下载主 JS 常超 5 秒，5 秒必误伤；
        //    12 秒足够绝大多数正常网络挂载完，又不会让用户干等太久。
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0) reloadOnce();
        }, 12000);
      })();
    </script>
  </body>
</html>
