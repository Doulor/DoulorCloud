<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doulor Cloud — 一站式云端平台，域名与服务开箱即用。" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Doulor Cloud</title>

    <!--
      尽早确定主题，必须在首帧之前执行。
      原先是靠 React 的 useEffect 给 <html> 打 dark 类，那要等 1.6 MB 的 JS 下载执行完 ——
      深色模式的用户会先看到一帧白底（开屏动画恰好在这段时间里，所以特别明显）。
      规则与 hooks/use-theme.ts 保持一致：存过的优先，否则跟随系统。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("doulor-theme")
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var dark = saved === "dark" || ((!saved || saved === "system") && prefersDark)
          document.documentElement.classList.toggle("dark", dark)
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错；拿不到就按浅色走，不阻塞渲染 */
        }
      })()
    </script>

    <!-- Open Graph：分享到 QQ / 微信 / Telegram 等时渲染的链接卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doulor Cloud" />
    <meta property="og:title" content="Doulor Cloud — 一站式云端平台" />
    <meta property="og:description" content="域名、邮箱、网盘、AI 等，一个账号开箱即用。" />
    <meta property="og:image" content="https://cloud.doulor.cn/favicon.png?v=2" />
    <meta property="og:url" content="https://cloud.doulor.cn" />
    <!-- Twitter/X 卡片兼容（也回退用 og 标签） -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Doulor Cloud — 一站式云端平台" />
    <meta name="twitter:description" content="域名、邮箱、网盘、AI 等，一个账号开箱即用。" />
    <meta name="twitter:image" content="https://cloud.doulor.cn/favicon.png?v=2" />

    <!--
      开屏动画的样式。刻意内联在这里、而不是放进 src/index.css：
      这段 HTML 在 <body> 里，浏览器一解析到就渲染，不必等 JS 下载执行
      （线上 vendor 包有 1.6 MB，等 React 挂载要一两秒 —— 那时页面都出来了，再盖一层就没意义了）。
      只在整页加载 / 刷新时出现一次：SPA 路由切换不会重新加载本文件，所以不需要任何额外判断。
      云用的是站上同一个图标（lucide Cloud），放大到 160px、不带外框。
    -->
    <style>
      /* ⚠️ 这里刻意用写死的颜色、不用 var(--background)：
         开屏必须在 CSS 文件下载完之前就能正确渲染，而变量定义在按需加载的样式表里，
         否则会回落到 fallback —— 深色模式下就是「白底一闪」。
         深浅两套值通过上面的 html.dark 切换；数值与 src/index.css 的
         --background / --foreground 一致（浅色 oklch(1 0 0) / oklch(0.145 0 0)，
         深色反之）。 */
      .splash-bg {
        position: absolute;
        inset: 0;
        background: #ffffff;
        transition: opacity 0.34s ease;
      }
      html.dark .splash-bg {
        background: #0a0a0a;
      }
      .splash-wrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .splash-cloud {
        color: #0a0a0a;
        transition:
          opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: opacity, transform;
      }
      html.dark .splash-cloud {
        color: #fafafa;
      }
      .splash-cloud svg {
        width: 160px;
        height: 160px;
        overflow: visible;
      }
      /* 55.39 是这条 path 的实测长度（getTotalLength）。写大了会「画完了还在空走」，写小了会画不满。
         ⚠️ 这里**没有** animation：进度完全由下面那段内联脚本按「应用是否就绪」驱动。
            原来用 CSS 定时（0.72s 画完就收尾），跟应用准备好没有毫无关系，
            于是 JS 慢一点就会出现「云画完了、界面还只有背景」。 */
      .splash-cloud path {
        stroke-dasharray: 55.39;
        stroke-dashoffset: 55.39;
      }
      .splash-name {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #0a0a0a;
        opacity: 0;
        transition: opacity 0.34s ease;
      }
      html.dark .splash-name {
        color: #fafafa;
      }
      /* 站名在云朵起笔之后淡入（类由内联脚本加） */
      .splash.is-named .splash-name {
        opacity: 1;
      }
      /* 收尾：整块淡出（类由内联脚本在云朵闭合之后加） */
      .splash.is-out .splash-cloud {
        opacity: 0;
        transform: scale(1.5);
      }
      .splash.is-out .splash-name {
        opacity: 0;
      }
      .splash.is-out .splash-bg {
        opacity: 0;
      }
      @media (max-width: 480px) {
        .splash-cloud svg {
          width: 112px;
          height: 112px;
        }
        .splash-name {
          font-size: 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- 开屏动画本体：不经过 React，页面一解析就显示 -->
    <div class="splash" id="boot-splash" aria-hidden="true">
      <div class="splash-bg"></div>
      <div class="splash-wrap">
        <div class="splash-cloud">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
          </svg>
        </div>
        <div class="splash-name">Doulor Cloud</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA：等页面加载完再注册 Service Worker，不抢首屏时间。
      // 注册失败（旧浏览器/隐私模式）不影响站点本身。
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {})
        })
      }
    </script>
    <script>
      /**
       * 开屏动画的驱动（2026-10-17 重做，站长要求）。
       *
       * 原来整条时间线由 CSS 定时写死：0.72s 云朵画完 -> 1.32s 收尾 -> 1.5s 摘 DOM。
       * 它跟「应用到底准备好没有」完全没有关系，所以 JS 慢一点就会出现
       * 「云画完了、界面还只有背景」；而提前撤掉又会露出半成品界面。
       *
       * 现在的规则：
       *   · 云朵先画到 **差一点闭合** 就停下来等（HOLD）；
       *   · React 侧（src/lib/boot-signal.ts）在「认证就绪 + 首屏内容已上屏」时
       *     调 window.__bootReady()；
       *   · 收到信号才把最后那一小段接上（闭合），然后整块淡出；
       *   · 信号来早的时候（云还没画到等待点）**不打断、不重排**：
       *     只把这一段动画的终点从 HOLD 改成 0，进度继续走 --
       *     位置连续、速度连续，所以不会有一下顿挫；
       *   · 信号一直不来（JS 全挂）-> 10 秒后自己收尾，把页面交给
       *     已有的「12 秒未挂载就自动刷新」兜底。
       */
      (function () {
        var el = document.getElementById("boot-splash");
        if (!el) return;
        var path = el.querySelector(".splash-cloud path");

        var LEN = 55.39;        /* 与 CSS 的 stroke-dasharray 一致（实测 getTotalLength） */
        var HOLD = LEN * 0.13;  /* 等待点：还差这么长才闭合 */
        var DRAW_MS = 620;      /* 起笔画到等待点的时间 */
        var CLOSE_MS = 190;     /* 最后闭合那一段的时间 */
        var FALLBACK_MS = 10000;
        var REMOVE_MS = 900;

        var target = HOLD;      /* 这一段动画的终点；就绪时改成 0 */
        var ready = false;
        var done = false;
        var raf = 0;
        /* 时间基准在**第一帧真正画出来时**才设（见 draw）：
           原来取脚本执行时刻，而浏览器从解析到这里到第一帧 rAF 之间还有样式/布局工作，
           差个几十毫秒很常见 —— 配上陡峭的缓动，第一帧就会瞬移一大截，
           看起来正是一下顿挫。 */
        var startedAt = 0;

        function setOffset(v) {
          if (path) path.style.strokeDashoffset = String(v);
        }
        function easeOutCubic(p) {
          return 1 - Math.pow(1 - p, 3);
        }
        /* 描边用 easeInOutCubic：起步和收笔都柔和。
           若用 easeOutCubic，开头速度是最末尾的 3 倍 —— 配合下面「以首帧为基准」
           会让前几帧跨得特别开，看起来就是一顿。 */
        function easeInOutCubic(p) {
          return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        }

        setOffset(LEN);

        /* 站名比云朵稍晚淡入，保留原来「先画出来、再出字」的节奏 */
        setTimeout(function () {
          if (!done) el.classList.add("is-named");
        }, 140);

        function endOut() {
          if (done) return;
          done = true;
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          el.classList.add("is-out");
          setTimeout(function () {
            var node = document.getElementById("boot-splash");
            if (node) node.remove();
          }, REMOVE_MS);
        }

        /* 已经停在等待点：把 HOLD -> 0 这一段补上（闭合） */
        function closeNow() {
          var from = path ? parseFloat(path.style.strokeDashoffset || "0") : 0;
          if (!isFinite(from)) from = 0;
          if (from <= 0.05) {
            setOffset(0);
            endOut();
            return;
          }
          var t0 = performance.now();
          /* 距离越长给的时间越多，但有个下限，免得最后几像素慢到像卡住 */
          var dur = Math.max(80, CLOSE_MS * (from / Math.max(HOLD, 1)));
          function step(now) {
            if (done) return;
            var p = Math.min(1, (now - t0) / dur);
            setOffset(from * (1 - easeOutCubic(p)));
            if (p < 1) {
              raf = requestAnimationFrame(step);
              return;
            }
            raf = 0;
            setOffset(0);
            endOut();
          }
          raf = requestAnimationFrame(step);
        }

        function draw(now) {
          if (done) return;
          if (!startedAt) startedAt = now;
          var p = Math.min(1, (now - startedAt) / DRAW_MS);
          setOffset(LEN - (LEN - target) * easeInOutCubic(p));
          if (p < 1) {
            raf = requestAnimationFrame(draw);
            return;
          }
          raf = 0;
          /* 画到终点时若已就绪（信号恰好在最后一帧到）-> 直接收尾 */
          if (target < HOLD - 0.5) {
            setOffset(0);
            endOut();
          }
        }
        raf = requestAnimationFrame(draw);

        window.__bootReady = function () {
          if (done || ready) return;
          ready = true;
          var p = startedAt ? Math.min(1, (performance.now() - startedAt) / DRAW_MS) : 0;
          if (p < 1) {
            /* 还在画：只改终点，动画继续跑（不重启 => 不会顿） */
            target = 0;
            return;
          }
          /* 已经停在等待点：补最后一段 */
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          closeNow();
        };

        /* 信号迟迟不来：自己收尾，别把开屏永远留在屏幕上 */
        setTimeout(function () {
          window.__bootReady();
        }, FALLBACK_MS);
      })();
    </script>
    <script>
      /**
       * 「一行 JS 都没跑起来」时的自救。
       *
       * 场景：部署后 chunk 哈希变了，而用户浏览器里还留着**旧 HTML**（它记着旧的
       * `assets/index-<old>.js`）。那个文件服务器上已经没有了 → 404 →
       * **入口脚本本身加载失败，任何业务 JS 都不会执行**。
       * 于是 src/lib/chunk-error.ts 那套全局兜底（它自己也是 JS）根本没机会生效，
       * 页面就停在启动画面上 —— 用户看到的就是「只有背景」（2026-10-02 站长反馈）。
       *
       * 这段内联脚本在 HTML 里就地生效，不依赖任何外部资源：
       *   ① 模块脚本加载失败 → 立刻刷新一次；
       *   ② 兜底：12 秒后应用仍未挂载（root 还是空的）→ 也刷新一次。
       *
       * 防循环（2026-10-05 修「手机端隔几秒就重播开屏动画」）用**双重保险**：
       *   · 一个会话最多自动刷新 2 次；
       *   · 两次之间至少间隔 15 秒。
       * 为什么不能只靠 10 秒时间窗：弱网手机上下载 1.6 MB 主 JS 常超 10 秒，
       * 时间窗会失效；5 秒兜底在弱网下也必然误伤「只是慢、不是失败」的加载。
       * 改成「最多 2 次」后，无论多差的环境，自动刷新顶多发生 2 次就停。
       */
      (function () {
        var KEY = "boot-reload-at";
        var COUNT_KEY = "boot-reload-count";
        var MAX_RELOADS = 2;
        var MIN_INTERVAL = 15000;
        function reloadOnce() {
          try {
            var count = Number(sessionStorage.getItem(COUNT_KEY) || 0);
            if (count >= MAX_RELOADS) return; // 刷满次数，放弃，交给用户手动刷新
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < MIN_INTERVAL) return; // 刚刷过
            sessionStorage.setItem(COUNT_KEY, String(count + 1));
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {
            // 隐私模式等场景 sessionStorage 不可用：仍然刷一次
          }
          location.reload();
        }
        // ① 模块脚本 404 会以 error 事件冒泡到 window，必须用 capture 才收得到
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") reloadOnce();
          },
          true
        );
        // ② 兜底：React 没挂载成功（root 为空）也刷一次。
        //    12 秒（原 5 秒太激进）：弱网手机下载主 JS 常超 5 秒，5 秒必误伤；
        //    12 秒足够绝大多数正常网络挂载完，又不会让用户干等太久。
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0) reloadOnce();
        }, 12000);
      })();
    </script>
  </body>
</html>
